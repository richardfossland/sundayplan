name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Supabase clients are created per-request, so the build never calls
          # them — but Next inlines NEXT_PUBLIC_* at build time, so provide
          # harmless placeholders to keep the build hermetic (no real backend).
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  worker:
    # The OpenNext/Cloudflare Worker build catches bundling breaks the check job
    # does NOT — e.g. an import OpenNext's esbuild pass cannot resolve — which
    # otherwise only surface at deploy. No Cloudflare auth: this builds the
    # Worker, it never deploys.
    name: worker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, booking]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Edge middleware only (no proxy.ts)
        # Next 16 suggests renaming middleware.ts to proxy.ts, which moves it
        # to the Node runtime. OpenNext 1.20 still BUILDS that (only an
        # "experimental" warning), so the build below would not catch it —
        # but the Node middleware breaks the deployed Worker. Keep middleware.ts.
        run: |
          found=$(find apps/${{ matrix.app }} \( -path '*/node_modules' -o -path '*/.next' -o -path '*/.open-next' \) -prune -o \
            \( -name 'proxy.ts' -o -name 'proxy.js' -o -name 'proxy.mjs' \) -print \
            | grep -v '/app/' || true)
          if [ -n "$found" ]; then
            echo "::error::Node-runtime proxy found — keep the Edge middleware.ts: $found"
            exit 1
          fi

      - name: OpenNext Worker build
        run: pnpm --filter @sundayplan/${{ matrix.app }} cf:build
        env:
          # Same harmless placeholders as the check job's build step. CI has no
          # .env files, so nothing real can be baked into the Worker bundle.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
